<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Audio TTS</title>
        <link rel="stylesheet" href="style.css">
    </head>
	
    <body>
        <h1>Audio Recorder</h1>
		<!--Buttons and stuff-->
        <button id="record-btn">Record</button>
        <button id="stop-btn" disabled>Stop</button>
		<button id="cancel-btn" disabled>Cancel Recording</button>
		<br><br>
		
		<!--Play back what the user said-->
        <audio id="audio-hearing" controls></audio>
		<br>	
		<div class="text-out">
			<h1 class="output-text" id="out-text">Your transcription will appear here</h1>
		</div>
		
		<button id="open-debug">Open debug menu</button>
		<!--Pure test features-->
		<input type="text" id="url-input">
		<br><br>
		<button id="test-btn">Test</button>
		
		<!--Scripts-->
        <script src="app.js"></script>
    </body>
</html>
